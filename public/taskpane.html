<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koreksi Klasifikasi Katalog</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header><h1>Koreksi Klasifikasi</h1><p>Katalog Sumber Daya · v2.0</p></header>
  <main>
    <p id="connection" role="status">Buka panel ini melalui Add-ins di Excel.</p>
    <p id="message" role="status" aria-live="polite"></p>

    <section class="toolbar">
      <button id="reload" type="button">Muat ulang master</button>
      <span id="count"></span>
    </section>

    <section id="setup" hidden><p id="setup-text"></p></section>

    <section id="row-card" hidden>
      <div class="card">
        <div class="row-head"><strong id="row-address">Baris -</strong></div>
        <dl>
          <dt>Nama produk / pekerjaan</dt><dd id="r-nama"></dd>
          <dt>Spesifikasi</dt><dd id="r-spek"></dd>
          <dt>Satuan · Merek</dt><dd id="r-misc"></dd>
        </dl>
      </div>

      <div class="card">
        <h2>Klasifikasi saat ini</h2>
        <ul class="path"><li id="c-l1"></li><li id="c-l2"></li><li id="c-l3"></li></ul>
        <p id="check" class="check"></p>
        <details id="suggest-card" hidden>
          <summary>Saran Level 3 dari nama produk</summary>
          <div id="suggestions"></div>
        </details>
      </div>

      <div class="card">
        <h2>Koreksi</h2>
        <p class="secondary">Ubah kolom yang salah saja. Kolom yang berubah akan diwarnai kuning di baris ini.</p>

        <label for="level1">Level 1</label>
        <select id="level1"></select>

        <label for="level2-input">Level 2 <span id="kode2" class="kode"></span></label>
        <div class="combo">
          <div class="combo-field"><input id="level2-input" type="text" role="combobox" aria-expanded="false" autocomplete="off" placeholder="Ketik atau klik panah"><button id="level2-toggle" type="button" aria-label="Daftar Level 2" aria-expanded="false">▾</button></div>
          <div id="level2-list" class="results" role="listbox" hidden></div>
        </div>

        <label for="level3-input">Level 3</label>
        <div class="combo">
          <div class="combo-field"><input id="level3-input" type="text" role="combobox" aria-expanded="false" autocomplete="off" placeholder="Ketik atau klik panah"><button id="level3-toggle" type="button" aria-label="Daftar Level 3" aria-expanded="false">▾</button></div>
          <div id="level3-list" class="results" role="listbox" hidden></div>
        </div>

        <label for="nama-input">Nama Produk / Pekerjaan</label>
        <div class="combo">
          <div class="combo-field"><input id="nama-input" type="text" role="combobox" aria-expanded="false" autocomplete="off" placeholder="Ketik atau klik panah"><button id="nama-toggle" type="button" aria-label="Daftar nama" aria-expanded="false">▾</button></div>
          <div id="nama-list" class="results" role="listbox" hidden></div>
        </div>

        <label for="spek-input">Spesifikasi</label>
        <div class="combo">
          <div class="combo-field"><input id="spek-input" type="text" role="combobox" aria-expanded="false" autocomplete="off" placeholder="Ketik atau klik panah"><button id="spek-toggle" type="button" aria-label="Daftar spesifikasi" aria-expanded="false">▾</button></div>
          <div id="spek-list" class="results" role="listbox" hidden></div>
        </div>

        <label for="note">Catatan (tersimpan otomatis di kolom Catatan Koreksi)</label>
        <textarea id="note" rows="2" placeholder="Opsional"></textarea>

        <div id="changes" class="changes" hidden></div>
        <p id="problem" class="problem" hidden></p>

        <label class="inline"><input id="move-row" type="checkbox" checked> Pindahkan baris ke kelompok yang benar setelah koreksi</label>
        <label class="inline"><input id="auto-next" type="checkbox"> Setelah menyimpan, lompat ke baris berikutnya yang tidak sesuai master</label>

        <div class="actions">
          <button id="save" type="button" class="primary">Simpan koreksi</button>
          <button id="valid" type="button">Sudah valid</button>
          <button id="reset" type="button">Kembalikan</button>
        </div>
      </div>

      <div class="nav">
        <button id="prev" type="button">◀ Sebelumnya</button>
        <button id="next" type="button">Berikutnya ▶</button>
        <button id="next-invalid" type="button">Tidak sesuai master ⏭</button>
      </div>
    </section>
  </main>
</body>
</html>
